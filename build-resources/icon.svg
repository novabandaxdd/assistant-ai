<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#080c14"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.5" stroke-dasharray="30 12"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="18 8"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00e5ff" stroke-width="5" stroke-opacity="0.7"/>
  <!-- Core -->
  <circle cx="256" cy="256" r="60" fill="rgba(0,229,255,0.12)" stroke="#00e5ff" stroke-width="5" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="24" fill="rgba(0,229,255,0.25)"/>
  <!-- J letter -->
  <text x="256" y="276" text-anchor="middle" font-family="Courier New, monospace" font-size="44" font-weight="900" fill="#00e5ff" letter-spacing="2">J</text>
  <!-- Orange arc accent -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f59e0b" stroke-width="10" stroke-opacity="0.9"
    stroke-dasharray="100 970" stroke-dashoffset="-40" stroke-linecap="round"/>
</svg>
